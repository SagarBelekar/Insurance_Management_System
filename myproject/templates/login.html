{% extends 'base.html' %}
{% block title %}Login - SecureLife{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-4">
                <h3 class="fw-bold text-center mb-3">Sign In</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2">Login</button>
                </form>
                <div class="text-center mt-3">
                    <small>Don't have an account? <a href="{% url 'register' %}">Register here</a></small>
                </div>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
