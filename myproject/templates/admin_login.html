{% extends 'base.html' %}
{% block title %}Admin Portal Login{% endblock %}

{% block content %}

{% load static %}

<style>
    body {
        background-image: url("{% static 'login_register.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
    }
</style>


<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom shadow-lg p-4 border-0">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-danger-subtle text-danger mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-shield-halved fa-xl"></i>
                    </div>
                    <h3 class="fw-bold">Admin Portal</h3>
                    <p class="text-muted small">Restricted Administrator Authentication</p>
                </div>
                
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Admin Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user-shield"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Administrator username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Admin Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2 fs-6 fw-semibold shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Access Admin Dashboard
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'landing_page' %}" class="small text-decoration-none text-muted">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Main Portal
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
