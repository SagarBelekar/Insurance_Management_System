{% extends 'base.html' %}
{% block title %}User Login - SecureLife{% endblock %}

{% block content %}

{% load static %}

<style>
    body {
        background-image: url("{% static 'login_register.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
    }
</style>



<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom shadow-lg p-4 border-0">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary-subtle text-primary mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-user fa-xl"></i>
                    </div>
                    <h3 class="fw-bold">User Login</h3>
                    <p class="text-muted small">Login in with your registered email and password</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="Enter your email address" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 fw-semibold shadow-sm">
                        Login to Dashboard
                    </button>
                </form>

                <hr class="my-4 text-muted">
                <div class="text-center">
                    <p class="small text-muted mb-1">New to SecureLife?</p>
                    <a href="{% url 'user_register' %}" class="fw-bold text-primary text-decoration-none">
                        <i class="fa-solid fa-user-plus"></i> Create an account (Register here)
                    </a>
                </div>
                <div class="text-center mt-4">
                    <a href="{% url 'landing_page' %}" class="small text-decoration-none text-muted">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Main Portal
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
